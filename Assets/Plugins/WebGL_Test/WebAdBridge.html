<script>
// ==== WebAd 对象：所有 WebGL 广告入口 ====
window.WebAd = {
    showBanner: function () {
        // 若已存在则直接显示
        let b = document.getElementById('webBanner');
        if (!b) {
            b = document.createElement('div');
            b.id = 'webBanner';
            b.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;height:90px;z-index:1000;text-align:center;';
            b.innerHTML = '<ins class="adsbygoogle"' +
                          ' style="display:inline-block;width:728px;height:90px"' +
                          ' data-ad-client="ca-pub-XXXX"' +
                          ' data-ad-slot="YYYY"></ins>';
            document.body.appendChild(b);
            (adsbygoogle = window.adsbygoogle || []).push({});
        } else {
            b.style.display = 'block';
        }
    },
    hideBanner: function () {
        const b = document.getElementById('webBanner');
        if (b) b.style.display = 'none';
    },
    showRewarded: function () {
        // 简单示例：打开一个 30s 不可跳过激励视频页面
        // 生产环境可接入 AdSense for Games 或第三方激励视频
        const url = 'rewarded.html?token=' + Date.now();
        const w = window.open(url, 'reward', 'width=400,height=300');
        const timer = setInterval(() => {
            if (w.closed) {
                clearInterval(timer);
                // 通知 Unity 奖励发放
                if (window.notifyReward) window.notifyReward(true);
            }
        }, 1000);
        return true;
    }
};

// 激励关闭后反向通知 Unity
window.notifyReward = function (reward) {
    SendMessage('AdsManager', 'OnWebRewardClosed', reward ? 1 : 0);
};
</script>
